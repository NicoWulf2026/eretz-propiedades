[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "eretz-propiedades"
version = "0.1.0"
description = "Pipeline A and quality tooling for ERETZ Propiedades"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "beautifulsoup4==4.14.3",
  "fastapi==0.135.3",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "playwright==1.58.0",
  "psutil==7.2.2",
  "psycopg[binary]==3.3.4",
  "python-dotenv==1.2.2",
  "requests==2.33.0",
  "uvicorn==0.44.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "ruff==0.16.0",
  "types-requests>=2.32.4.20260107",
]

[tool.setuptools.packages.find]
include = ["scraper*"]
exclude = ["tests*", "Viejo*", "_scratch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".venv",
  ".next",
  "_scratch",
  "Viejo",
  "backups",
  "data",
  "frontend",
  "logs",
  "node_modules",
  "reports",
]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "_scratch",
  "Viejo",
  "backups",
  "data",
  "frontend",
  "logs",
  "reports",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["scraper/network_security.py"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
