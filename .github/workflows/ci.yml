name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m compileall -q scraper scripts api tests
      - run: python -m pytest -q
      - run: ruff check scraper/network_security.py tests/test_network_security.py
      - run: mypy
      - run: python -m pip_audit -r requirements.lock --progress-spinner off
      - name: Block disabled TLS verification
        shell: bash
        run: |
          if rg -n 'verify\s*=\s*False|disable_warnings\s*\(' scraper scripts api \
            --glob '*.py'; then
            echo "Insecure TLS override found."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

