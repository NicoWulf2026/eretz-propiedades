name: qa-navegador-sintetica

# QA de navegador de punta a punta sobre la snapshot SINTETICA (sin datos
# privados): API v2 + next dev + Playwright. Ver scripts/qa_navegador_sintetica.py.
# Solo manual por ahora: todavia no corrio en Actions y no debe poner en rojo un PR
# hasta demostrar que es estable. Cuando lo sea, sumar `pull_request`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r requirements.lock
      # El Chromium que corresponde a la version fijada de playwright (1.58.0).
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - name: QA de navegador sobre la snapshot sintetica
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: python scripts/qa_navegador_sintetica.py --salida _qa_sintetica
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-navegador-sintetica
          path: |
            _qa_sintetica/QA_NAVEGADOR_SINTETICA.json
            _qa_sintetica/e2e.log
            _qa_sintetica/e2e_junit.xml
            _qa_sintetica/api.log
            _qa_sintetica/web.log
